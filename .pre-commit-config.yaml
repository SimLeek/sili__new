# Runs on every commit. Hard gates: ruff, format, clang-format, bandit,
# codespell, gitleaks, shellcheck. Advisory-only tools (mypy, pydoclint,
# clang-tidy, cppcheck, vulture, radon, lizard) live in tools/lint_all.sh
# instead -- clang-tidy needs a compile_commands.json we don't generate,
# and cppcheck --enable=all times out (>2min) against the templated
# header tree at default settings; both need a separate, more deliberate
# pass, not bundled into formatting/lint setup.
# mypy strict-mode found 468 pre-existing errors across 14 files in sili/,
# and pydoclint found dozens of pre-existing docstring/signature mismatches
# the moment it was run against files this pass merely reformatted (never
# checked before this lint setup existed); making either a hard gate now
# would block any future commit touching those files until a dedicated
# pass happens. Promote to a hard gate once sili/ is clean.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.4          # bump to latest
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v22.1.8   # pinned to match this machine's system clang-format
    hooks:
      - id: clang-format
        types_or: [c++, c]

  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.2
    hooks:
      - id: bandit
        args: ["-c", ".bandit", "-r", "sili"]

  - repo: https://github.com/codespell-project/codespell
    rev: v2.3.0
    hooks:
      - id: codespell
        args: ["--skip", "*.sst,*.safetensors,*.cpp,*.hpp", "--ignore-words-list", "nin,coo"]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        args: ["--external-sources"]

  - repo: local
    hooks:
      - id: comment-limit
        name: comment density limit (<=30%)
        entry: python3 tools/comment_limit.py
        language: system
        types_or: [python, c++, c]
        # 12 pre-existing files across sili/ exceed 30% comment density
        # (task #386, flagged for user, NOT rewritten blind -- this is
        # decades of research narrative/derivation, not AI slop, and
        # deciding what moves to a research .md vs. stays inline is a
        # real editorial call, not a lint-pass side effect). Percentages
        # below are post-clang-format (task #386 followup):
        # rl_utils.py 52.5%, sparse_rnn.py 43.0%, __init__.py 66.7%
        # (3-line file, N/A in practice), energy.py 54.8%,
        # conversion/rnn_fold.py 38.0%, conversion/streaming_prune.py
        # 30.4%, conversion/prune_sensitivity.py 39.9%,
        # lib/headers/sparse_struct.hpp 38.1% (21-line file, N/A in
        # practice), lib/headers/fp4quant.hpp 35.7%, lib/headers/fp8quant.hpp 32.5%,
        # lib/headers/delta_csr_types.hpp 45.1%. Also 3 one-off benchmark
        # scripts (mostly header-comment-driven, never covered by this
        # hook before it applied repo-wide):
        # scripts/bench_block4_vs_dense_fp4.cpp 31.1%,
        # scripts/bench_block4_memory_and_compression.cpp 40.2%,
        # scripts/bench_block4_fp8_simd.cpp 42.3%.
        # cppcheck-remediation pass (task #386 followup): lib/headers/scan.hpp
        # 44.7% (down to a single real 47-line function after removing dead
        # code -- same "tiny file, N/A in practice" case as sparse_struct.hpp
        # above), lib/headers/sisldo_ops.hpp 30.1% (justified cppcheck-suppress
        # comments nudged it barely back over the same razor's-edge threshold
        # noted below as "dropped below 30% after clang-format"),
        # lib/headers/hoyer_sparsify.hpp 30.3% (155-line file, justified
        # cppcheck-suppress comments on 4 struct fields -- same razor's-edge
        # case as sisldo_ops.hpp above).
        # task #389 (comment-to-research-doc pass): lib/headers/linear_disldo.hpp
        # moved its research narrative to docs/research/linear_disldo.rst and
        # dropped from 44.5% to under 30% -- removed from this list.
        exclude: ^(tests/|sili/rl_utils\.py|sili/sparse_rnn\.py|sili/__init__\.py|sili/energy\.py|sili/conversion/rnn_fold\.py|sili/conversion/streaming_prune\.py|sili/conversion/prune_sensitivity\.py|sili/lib/headers/sparse_struct\.hpp|sili/lib/headers/fp4quant\.hpp|sili/lib/headers/fp8quant\.hpp|sili/lib/headers/delta_csr_types\.hpp|sili/lib/headers/scan\.hpp|sili/lib/headers/sisldo_ops\.hpp|sili/lib/headers/hoyer_sparsify\.hpp|scripts/bench_block4_vs_dense_fp4\.cpp|scripts/bench_block4_memory_and_compression\.cpp|scripts/bench_block4_fp8_simd\.cpp)

      - id: pytest-fast
        name: pytest (fast suite, <10s -- excludes integration/pre_existing_failure)
        entry: python3 -m pytest
        language: system
        pass_filenames: false
        always_run: true
