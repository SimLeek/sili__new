# Runs on every commit. Hard gates: ruff, format, bandit, codespell,
# gitleaks, shellcheck. Advisory-only tools (mypy, pydoclint, clang-tidy,
# cppcheck, vulture, radon, lizard) live in tools/lint_all.sh instead --
# mypy strict-mode found 468 pre-existing errors across 14 files in sili/,
# and pydoclint found dozens of pre-existing docstring/signature mismatches
# the moment it was run against files this pass merely reformatted (never
# checked before this lint setup existed); making either a hard gate now
# would block any future commit touching those files until a dedicated
# pass happens. Promote to a hard gate once sili/ is clean.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.4          # bump to latest
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.2
    hooks:
      - id: bandit
        args: ["-c", ".bandit", "-r", "sili"]

  - repo: https://github.com/codespell-project/codespell
    rev: v2.3.0
    hooks:
      - id: codespell
        args: ["--skip", "*.sst,*.safetensors,*.cpp,*.hpp", "--ignore-words-list", "nin,coo"]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        args: ["--external-sources"]

  - repo: local
    hooks:
      - id: comment-limit
        name: comment density limit (<=30%)
        entry: python3 tools/comment_limit.py
        language: system
        types_or: [python, c++, c]
        # 13 pre-existing files across sili/ exceed 30% comment density
        # (task #386, flagged for user, NOT rewritten blind -- this is
        # decades of research narrative/derivation, not AI slop, and
        # deciding what moves to a research .md vs. stays inline is a
        # real editorial call, not a lint-pass side effect):
        # rl_utils.py 52.5%, sparse_rnn.py 43.0%, __init__.py 66.7%
        # (3-line file, N/A in practice), energy.py 54.8%,
        # conversion/rnn_fold.py 38.0%, conversion/streaming_prune.py
        # 30.4%, conversion/prune_sensitivity.py 39.9%,
        # lib/headers/sparse_struct.hpp 38.1% (21-line file, N/A in
        # practice), lib/headers/linear_disldo.hpp 50.7%,
        # lib/headers/sisldo_ops.hpp 32.9%, lib/headers/fp4quant.hpp
        # 36.7%, lib/headers/fp8quant.hpp 33.6%,
        # lib/headers/delta_csr_types.hpp 47.1%.
        exclude: ^(tests/|sili/rl_utils\.py|sili/sparse_rnn\.py|sili/__init__\.py|sili/energy\.py|sili/conversion/rnn_fold\.py|sili/conversion/streaming_prune\.py|sili/conversion/prune_sensitivity\.py|sili/lib/headers/sparse_struct\.hpp|sili/lib/headers/linear_disldo\.hpp|sili/lib/headers/sisldo_ops\.hpp|sili/lib/headers/fp4quant\.hpp|sili/lib/headers/fp8quant\.hpp|sili/lib/headers/delta_csr_types\.hpp)

      - id: pytest-fast
        name: pytest (fast suite, <10s -- excludes integration/pre_existing_failure)
        entry: python3 -m pytest
        language: system
        pass_filenames: false
        always_run: true
