[build-system]
# PEP 517/518: pip builds this project in an ISOLATED environment that starts
# empty except for whatever is listed here. setup.py needs pybind11 (for
# pybind11.get_include()) merely to be IMPORTED -- without this section, pip
# has no way to know that before it evaluates setup.py, causing exactly the
# "ModuleNotFoundError: No module named 'pybind11'" failure this file exists
# to fix (hit during `pip install -e .`'s "Getting requirements to build
# editable" step, before requirements.txt is ever consulted).
requires = ["setuptools>=64", "wheel", "pybind11>=3.0.2"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests/unit/python"]
# Default `pytest` run stays fast (<10s) and 100% green: excludes tests
# in test_sili_pre_existing_failures.py that are known-broken (investigated,
# not fixed -- see that file's own header) and slow/training-style tests.
# Run `pytest -m pre_existing_failure` or `-m integration` explicitly to
# see those. `pytest -m ""` (empty string) runs everything unfiltered.
addopts = "-m 'not integration and not pre_existing_failure'"
markers = [
    "integration: slow/training-style test, not run by default or in pre-commit (run explicitly: pytest -m integration)",
    "pre_existing_failure: known-broken test in test_sili_pre_existing_failures.py, investigated but not fixed -- excluded from the default/pre-commit run",
]
