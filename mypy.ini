[mypy]
strict = True
warn_unreachable = True
# Ratchet note: run `mypy sili` once, and if the legacy surface drowns you,
# add per-module overrides below instead of dropping strict globally.
exclude = (?x)(
    ^backburner/
    | ^docs/
    | ^tests/unit/python/   # stale legacy scripts
  )

# torch isn't installed as a hard dependency of this package; silence the
# import noise so real findings in sili/ aren't drowned out.
[mypy-torch.*]
ignore_missing_imports = True
